name: Reference App Tests

on:
  schedule:
    # Nightly at 02:00 UTC — third-party uptime should not block PR merges.
    - cron: '0 2 * * *'
  workflow_dispatch:

# This workflow is NOT in the required-checks list for PRs.
# External availability issues (automationexercise.com) are isolated here.

jobs:
  reference-app:
    name: Reference app test suite
    runs-on: ubuntu-latest
    env:
      ENV: staging
      CI: 'true'
      # Emails are non-sensitive — hardcoded here. Only passwords go in Secrets.
      WORKER_0_EMAIL: user_4h93kojajs@testframe.dev
      WORKER_0_PASSWORD: ${{ secrets.WORKER_0_PASSWORD }}
      WORKER_1_EMAIL: user_ds8qt1qosc@testframe.dev
      WORKER_1_PASSWORD: ${{ secrets.WORKER_1_PASSWORD }}
      WORKER_2_EMAIL: user_goyb02dnsf@testframe.dev
      WORKER_2_PASSWORD: ${{ secrets.WORKER_2_PASSWORD }}
      WORKER_3_EMAIL: user_uoyv4gwpu3@testframe.dev
      WORKER_3_PASSWORD: ${{ secrets.WORKER_3_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('apps/e2e-tests/package.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        working-directory: apps/e2e-tests

      - name: Run reference-app suite
        run: npm run -w @framework/e2e-tests test:reference-app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-app-report-${{ github.run_number }}
          path: |
            apps/e2e-tests/playwright-report/
            apps/e2e-tests/test-results/
          retention-days: 30
